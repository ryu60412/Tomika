html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; background: #ffd966; font-weight: 700; }

.preview { border-radius: 20px; position: relative; overflow: hidden; border: 6px solid #fff; }

.demo-bar { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(0,0,0,.7); padding: 10px 16px; border-radius: 30px; display: none; align-items: center; gap: 12px; color: #fff; font-size: 18px; }
.demo-bar.show { display: flex; }
.demo-bar input[type=range] { flex: 1; height: 30px; }
.bg-bar { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 70%; }
.bg-btn { background: rgba(0,0,0,.6); color: #fff; border: 2px solid #fff; padding: 6px 10px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 900; }
.bg-btn.active { background: #ee5253; }
.panel { background: #fff; border-radius: 20px; padding: 16px; overflow-y: auto; border: 4px solid #ffe066; }
.panel h2 { margin: 0 0 12px; font-size: 22px; color: #ee5253; text-align: center; }
.car-tab-bar { display: flex; gap: 6px; margin-bottom: 10px; }
.car-tab { flex: 1; padding: 10px; border: 0; border-radius: 12px; background: #f0f0f0; font-size: 16px; font-weight: 900; cursor: pointer; }
.car-tab.active { background: #4ecdc4; color: #fff; }
.car-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.car-card { background: #fff8e1; border: 3px solid #ffd966; padding: 10px 4px; border-radius: 14px; text-align: center; cursor: pointer; }

.car-card.selected { background: #ff6b6b; border-color: #c0392b; color: #fff; }
.car-icon { font-size: 32px; }
.car-label { font-size: 13px; margin-top: 4px; }
.color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.color-swatch { aspect-ratio: 1; border-radius: 50%; border: 4px solid #fff; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.color-swatch.selected { border-color: #333; transform: scale(1.15); }
.wheel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wheel-card { background: #f0f0f0; border: 3px solid #ddd; border-radius: 14px; padding: 8px; text-align: center; cursor: pointer; }

.wheel-card svg { width: 50px; height: 50px; }
.wheel-card .lbl { font-size: 12px; margin-top: 2px; }
footer { background: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }

.step-dot { width: 16px; height: 16px; border-radius: 50%; background: #ddd; }
.step-dot.active { background: #ee5253; transform: scale(1.4); }

.btn-back { background: #aaa; box-shadow: 0 4px 0 #888; }
.btn-next { background: #4ecdc4; box-shadow: 0 4px 0 #2eaba2; }

const audio = { ctx:null, sfxOn:true, bgmOn:false, bgmTimer:null, bgmNotes:[], bgmIdx:0 };
function initAudio() {
  if (audio.ctx) return;
  try { audio.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
}
function tone(freq, dur=0.1, type='sine', vol=0.15, when=0) {
  if (!audio.sfxOn && !arguments[5]) return;
  initAudio();
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime + when;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audio.ctx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  tap: () => tone(880, 0.06, 'square', 0.08),
  ok: () => { tone(660,0.08,'sine',0.15); tone(880,0.1,'sine',0.15,0.08); },
  car: () => { tone(220,0.15,'sawtooth',0.1); tone(280,0.2,'sawtooth',0.1,0.1); },
  finish: () => { tone(523,0.1); tone(659,0.1,'sine',0.15,0.1); tone(784,0.2,'sine',0.15,0.2); tone(1047,0.3,'sine',0.15,0.4); },
  horn: () => { tone(440,0.2,'square',0.2); tone(330,0.3,'square',0.2,0.15); },
  engine: () => { tone(80,0.5,'sawtooth',0.05); tone(120,0.3,'sawtooth',0.05,0.1); }
};
function hornBeep() { initAudio(); if(audio.ctx) audio.ctx.resume(); sfx.horn(); }
function toggleSFX() {
  audio.sfxOn = !audio.sfxOn;
  document.getElementById('sfxBtn').classList.toggle('on', audio.sfxOn);
  if (audio.sfxOn) sfx.tap();
}

/* ===== BGM ===== */
const BGM_TRACKS = {
  pop: [['C4',300],['E4',300],['G4',300],['E4',300],['F4',300],['A4',300],['G4',300],['E4',300],['D4',300],['F4',300],['E4',300],['C4',600]],
  excite: [['C5',200],['G4',200],['C5',200],['E5',200],['G5',400],['F5',200],['E5',200],['D5',200],['C5',400]],
  race: [['E4',150],['G4',150],['B4',150],['E5',300],['D5',150],['B4',150],['G4',300],['A4',150],['B4',150],['C5',300],['G4',300]]
};
const NOTES = { 'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99 };
function toggleBGM() {
  audio.bgmOn = !audio.bgmOn;
  document.getElementById('bgmBtn').classList.toggle('on', audio.bgmOn);
  if (audio.bgmOn) startBGM(); else stopBGM();
}
function startBGM() {
  initAudio(); if(audio.ctx) audio.ctx.resume();
  const trackName = state.bgType === 'race' ? 'race' : (state.bgType === 'city' ? 'excite' : 'pop');
  audio.bgmNotes = BGM_TRACKS[trackName];
  audio.bgmIdx = 0;
  playBGMNote();
}
function stopBGM() {
  clearTimeout(audio.bgmTimer);
  audio.bgmTimer = null;
}
function playBGMNote() {
  if (!audio.bgmOn) return;
  const [note, dur] = audio.bgmNotes[audio.bgmIdx];
  const freq = NOTES[note] || 440;
  tone(freq, dur/1000, 'triangle', 0.04, 0, true);
  audio.bgmIdx = (audio.bgmIdx + 1) % audio.bgmNotes.length;
  audio.bgmTimer = setTimeout(playBGMNote, dur);
}

const PALETTE = ['#e63946','#ff6b6b','#ffa500','#ffd60a','#06d6a0','#2a9d8f','#4ecdc4','#118ab2','#6c5ce7','#a55eea','#ff6b9d','#ffffff','#1a1a1a','#8b4513','#c0c0c0'];

function renderStepDots() {
  document.getElementById('stepDots').innerHTML = STEPS.map((s,i)=>
    `<div class="step-dot ${i===currentStep?'active':''} ${i<currentStep?'done':''}"></div>`
  ).join('');
}

function renderBgBar() {
  document.getElementById('bgBar').innerHTML = Object.entries(BACKGROUNDS).map(([k,v])=>
    `<button class="bg-btn ${state.bgType===k?'active':''}" onclick="setBg('${k}')">${v.label}</button>`
  ).join('');
}
function setBg(k) {
  state.bgType = k;
  sfx.tap();
  renderBgBar();
  render();
  if (audio.bgmOn) { stopBGM(); startBGM(); }
}

function renderPanel() {
  const step = STEPS[currentStep];
  const panel = document.getElementById('panel');
  let html = '';

  if (step.id === 'category') {
    html = `<h2>どんな くるま？</h2>
      <div class="car-tab-bar">
        ${Object.entries(CATEGORIES).map(([k,c])=>`
          <button class="car-tab ${state.category===k?'active':''}" onclick="selectCategory('${k}')">${c.label}</button>
        `).join('')}
      </div>
      <p style="text-align:center;font-size:14px;color:#666;margin-top:14px">↑ うえから えらんでね</p>`;
  } else if (step.id === 'body') {
    const list = CATEGORIES[state.category].cars;
    html = `<h2>すきな くるまを えらぼう</h2>
      <div class="car-grid">${list.map(k=>{
        const c = CARS[k];
        return `<div class="car-card ${state.bodyType===k?'selected':''}" onclick="selectBody('${k}')">
          <div class="car-icon">${c.icon}</div>
          <div class="car-label">${c.label}</div>
        </div>`;
      }).join('')}</div>`;
  } else if (step.id === 'color') {
    html = `<h2>すきな いろ</h2>
      <p style="text-align:center;font-size:14px;color:#666;margin-bottom:10px">ボディの いろ</p>
      <div class="color-grid">${PALETTE.map(c=>`
        <div class="color-swatch ${state.bodyColor===c?'selected':''}" style="background:${c}" onclick="setColor('body','${c}')"></div>
      `).join('')}</div>
      <p style="text-align:center;font-size:14px;color:#666;margin:14px 0 10px">やね・もよう の いろ</p>
      <div class="color-grid">${PALETTE.map(c=>`
        <div class="color-swatch ${state.subColor===c?'selected':''}" style="background:${c}" onclick="setColor('sub','${c}')"></div>
      `).join('')}</div>`;
  } else if (step.id === 'wheel') {
    const wheels = [['spoke5','スポーク'],['mesh','メッシュ'],['turbine','タービン'],['star','ほし'],['disk','まる'],['offroad','ごつい']];
    html = `<h2>タイヤを えらぼう</h2>
      <div class="wheel-grid">${wheels.map(([v,l])=>`
        <div class="wheel-card ${state.wheelStyle===v?'selected':''}" onclick="setWheel('${v}')">
          <svg viewBox="-40 -40 80 80">${wheelPreview(v)}</svg>
          <div class="lbl">${l}</div>
        </div>
      `).join('')}</div>
      <p style="text-align:center;font-size:14px;color:#666;margin:14px 0 10px">ホイールいろ</p>
      <div class="color-grid">${['#cccccc','#ffd60a','#1a1a1a','#4ecdc4','#ff6b6b'].map(c=>`
        <div class="color-swatch ${state.hubColor===c?'selected':''}" style="background:${c}" onclick="setHub('${c}')"></div>
      `).join('')}</div>`;
  } else if (step.id === 'decal') {
    html = `<h2>もじを いれる？</h2>
      <p style="text-align:center;font-size:14px;color:#666;margin-bottom:12px">いれなくても いいよ</p>
      <input type="text" maxlength="10" placeholder="れい：POLICE" value="${escapeHtml(state.decalText)}"
        oninput="state.decalText=this.value;render()"
        style="width:100%;padding:14px;font-size:20px;border:3px solid #ffd966;border-radius:12px;text-align:center;font-weight:900">
      <p style="text-align:center;font-size:14px;color:#666;margin:14px 0 10px">よく つかうもの</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${['POLICE','FIRE','救急','TAXI','SCHOOL','POST','','GO!','★'].map(t=>`
          <button onclick="state.decalText='${t}';sfx.tap();renderPanel();render()" style="padding:10px;border:3px solid #ffd966;background:#fff;border-radius:10px;font-size:16px;font-weight:900;cursor:pointer">${t||'なし'}</button>
        `).join('')}
      </div>`;
  } else if (step.id === 'finish') {
    const car = CARS[state.bodyType];
    html = `<div class="finish-msg">
      <div class="big">🎉</div>
      <div class="ttl">かんせい！</div>
      <div style="font-size:20px">${car.icon} ${car.label}</div>
    </div>
    <div class="finish-actions">
      <button class="btn-play" onclick="toggleDemo()">${demo.on?'■ とめる':'🏁 はしらせる！'}</button>
      <button class="btn-horn" onclick="hornBeep()">📯 クラクション</button>
      <button class="btn-save" onclick="exportPNG();sfx.ok()">📷 がぞうで ほぞん</button>
      <button class="btn-again" onclick="resetAll()">🔄 もういっかい</button>
    </div>`;
  }

  panel.innerHTML = html;
  updateNavButtons();
}

function updateNavButtons() {
  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');
  back.style.visibility = currentStep === 0 ? 'hidden' : 'visible';
  if (currentStep === STEPS.length - 1) {
    next.style.visibility = 'hidden';
  } else {
    next.style.visibility = 'visible';
    const can = currentStep === 0 ? true : (currentStep === 1 ? state.bodyType !== null : true);
    next.disabled = !can;
    next.textContent = currentStep === STEPS.length - 2 ? 'かんせい！🎉' : 'つぎへ →';
  }
}

function selectCategory(c) { state.category = c; sfx.tap(); renderPanel(); }
function selectBody(t) {
  state.bodyType = t;
  const car = CARS[t];
  state.bodyColor = car.defaultColor;
  state.subColor = car.defaultSub;
  state.decalText = car.defaultDecal || '';
  if (['excavator','bulldozer'].includes(t)) state.wheelStyle = 'offroad';
  sfx.car();
  renderPanel(); render();
}
function setColor(which, c) { if (which==='body') state.bodyColor=c; else state.subColor=c; sfx.tap(); renderPanel(); render(); }
function setWheel(v) { state.wheelStyle = v; sfx.tap(); renderPanel(); render(); }
function setHub(c) { state.hubColor = c; sfx.tap(); renderPanel(); render(); }
function nextStep() { if (currentStep < STEPS.length-1) { currentStep++; if (currentStep === STEPS.length-1) sfx.finish(); else sfx.tap(); renderStepDots(); renderPanel(); render(); } }
function prevStep() { if (currentStep > 0) { currentStep--; sfx.tap(); renderStepDots(); renderPanel(); render(); } }
function resetAll() { currentStep = 0; state.bodyType = null; state.decalText = ''; if (demo.on) toggleDemo(); renderStepDots(); renderPanel(); render(); }

function wheelPreview(style) {
  const tmp = state.wheelStyle;
  state.wheelStyle = style;
  const html = renderWheelInner(0, 0, 30, 0);
  state.wheelStyle = tmp;
  return html;
}

const demo = { on:false, t:0, speed:10, bgOffset:0, wheelAngle:0, raf:null, sirenTimer:null };
function toggleDemo() {
  demo.on = !demo.on;
  document.getElementById('demoBar').classList.toggle('show', demo.on);
  renderPanel();
  if (demo.on) {
    sfx.engine();
    const car = CARS[state.bodyType];
    if (car && car.sirenSfx) startSiren();
    loop();
  } else {
    cancelAnimationFrame(demo.raf);
    stopSiren();
    render();
  }
}
function startSiren() {
  let high = true;
  const beat = () => {
    if (!demo.on) return;
    tone(high ? 880 : 660, 0.3, 'sine', 0.1);
    high = !high;
    demo.sirenTimer = setTimeout(beat, 350);
  };
  beat();
}
function stopSiren() { clearTimeout(demo.sirenTimer); }
function loop() {
  if (!demo.on) return;
  demo.t++;
  demo.bgOffset = (demo.bgOffset + demo.speed) % 80;
  demo.wheelAngle = (demo.wheelAngle + demo.speed*5) % 360;
  render();
  demo.raf = requestAnimationFrame(loop);
}
document.getElementById('demoSpeed').addEventListener('input', e => { demo.speed = Number(e.target.value); });

/* ===== 描画 ===== */
function render() {
  const svg = document.getElementById('stage');
  if (!state.bodyType) {
    svg.innerHTML = `${renderBackground()}<text x="400" y="200" text-anchor="middle" font-size="32" fill="rgba(255,255,255,.95)" font-weight="900" stroke="rgba(0,0,0,.5)" stroke-width="1">⬅ くるまを えらんでね</text>`;
    return;
  }
  const car = CARS[state.bodyType];
  const bounce = demo.on ? Math.sin(demo.t * 0.3) * 2 : 0;
  const grads = `<defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${lighten(state.bodyColor, 0.4)}"/>
      <stop offset="25%" stop-color="${lighten(state.bodyColor, 0.15)}"/>
      <stop offset="50%" stop-color="${state.bodyColor}"/>
      <stop offset="100%" stop-color="${darken(state.bodyColor, 0.3)}"/>
    </linearGradient>
    <linearGradient id="bodyShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${lighten(state.subColor, 0.2)}"/>
      <stop offset="100%" stop-color="${state.subColor}"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(180,220,255,0.85)"/>
      <stop offset="50%" stop-color="rgba(80,140,200,0.75)"/>
      <stop offset="100%" stop-color="rgba(40,80,140,0.7)"/>
    </linearGradient>
    <radialGradient id="headGlow"><stop offset="0%" stop-color="#ffffcc" stop-opacity="1"/><stop offset="100%" stop-color="#ffff00" stop-opacity="0"/></radialGradient>
    <radialGradient id="sirenRedGlow"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.8"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></radialGradient>
    <radialGradient id="sirenBlueGlow"><stop offset="0%" stop-color="#0000ff" stop-opacity="0.8"/><stop offset="100%" stop-color="#0000ff" stop-opacity="0"/></radialGradient>
    <clipPath id="bodyClip"><path d="${car.body()}"/></clipPath>
  </defs>`;
  const bg = renderBackground();
  const shadow = `<ellipse cx="400" cy="335" rx="295" ry="12" fill="rgba(0,0,0,.4)"/>`;
  let crawlers = '';
  if (car.crawlers) crawlers = renderCrawler(car.wheelF.x, 312) + renderCrawler(car.wheelR.x, 312);
  let arches = '';
  if (!car.crawlers) [car.archF, car.archR, car.archR2, car.archR3].filter(Boolean).forEach(a => { arches += `<circle cx="${a.x}" cy="${a.y}" r="${a.r}" fill="#0a0a0a"/>`; });
  const bodyEl = `<path d="${car.body()}" fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" transform="translate(0,${bounce})"/>`;
  const bodyShine = `<path d="${car.body()}" fill="url(#bodyShine)" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  let subPaint = '';
  if (['sedan'].includes(car.bodyStyle) && state.subColor !== state.bodyColor && car.sideStripe === 'middle') {
    subPaint = `<rect x="0" y="262" width="800" height="50" fill="url(#subGrad)" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  } else if (['van','truck','bus','wagon','suv'].includes(car.bodyStyle) && state.subColor !== state.bodyColor) {
    subPaint = `<rect x="0" y="100" width="800" height="40" fill="url(#subGrad)" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  }
  let stripe = '';
  if (car.sideStripe === 'cross') stripe = `<rect x="0" y="180" width="800" height="8" fill="${state.subColor}" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  // パネルライン
  let panelLines = '';
  (car.panelLines || []).forEach(p => {
    panelLines += `<line x1="${p.x1}" y1="${p.y1+bounce}" x2="${p.x2}" y2="${p.y2+bounce}" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>`;
  });
  // ガラス（リアル）
  let glass = '';
  if (car.window) {
    glass = `<path d="${car.window()}" fill="url(#glassGrad)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" transform="translate(0,${bounce})"/>`;
    // 反射ハイライト
    glass += `<path d="${car.window()}" fill="rgba(255,255,255,0.3)" clip-path="url(#bodyClip)" transform="translate(0,${bounce-2}) scale(0.95) translate(20,5)"/>`;

  // ミラー

  if (car.accessories === 'bulldozerBlade') accessories = renderBulldozerBlade(bounce);

  if (car.spoiler) accessories += `<path d="M 660 240 L 705 215 L 720 215 L 720 235 Z" fill="${state.bodyColor}" stroke="#1a1a1a" stroke-width="2.5" transform="translate(0,${bounce})"/>`;
  // デカール（エンブレム風）

  if (!car.crawlers) [car.wheelF, car.wheelR, car.wheelR2, car.wheelR3].filter(Boolean).forEach(w => { wheels += renderWheel(w); });

  }
  svg.innerHTML = `${grads}${bg}${shadow}${exhaust}${crawlers}${arches}${bodyEl}${bodyShine}${subPaint}${stripe}${panelLines}${glass}${pillars}${grille}${lights}${handles}${mirror}${roofItem}${accessories}${decal}${wheels}`;
}

function renderSiren(bounce) {
  const positions = { police:{x:415,y:158}, ambulance:{x:455,y:130} };
  const p = positions[state.bodyType] || {x:400,y:155};
  const blink = demo.on && Math.floor(demo.t/8)%2===0;
  let glow = '';
  if (demo.on) {
    if (blink) glow = `<circle cx="${p.x-16}" cy="${p.y+bounce-9}" r="35" fill="url(#sirenRedGlow)"/>`;
    else glow = `<circle cx="${p.x+16}" cy="${p.y+bounce-9}" r="35" fill="url(#sirenBlueGlow)"/>`;
  }
  return `${glow}<g transform="translate(${p.x},${p.y+bounce})">
    <rect x="-32" y="-16" width="64" height="14" rx="3" fill="#1a1a1a"/>
    <rect x="-30" y="-14" width="28" height="10" fill="${blink?'#ff3333':'#660000'}"/>
    <rect x="2" y="-14" width="28" height="10" fill="${blink?'#3333ff':'#000066'}"/>

}

function renderMixerDrum(bounce) {

    <ellipse cx="0" cy="0" rx="170" ry="48" fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="3"/>

function renderBusStripe(bounce) {
  return `<rect x="95" y="210" width="610" height="10" fill="${state.subColor}" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
}
function renderCrawler(cx, cy) {
  const w = 130;
  let treads = '';
  for (let i = 0; i < 16; i++) {
    const x = cx - w/2 + i*(w/16) + (demo.on ? demo.bgOffset%8 : 0);
    treads += `<rect x="${x}" y="${cy-10}" width="4" height="20" fill="#333"/>`;
  }
  return `<g>
    <rect x="${cx-w/2-5}" y="${cy-14}" width="${w+10}" height="28" rx="14" fill="#1a1a1a"/>
    ${treads}
    <circle cx="${cx-w/2}" cy="${cy}" r="14" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="${cx+w/2}" cy="${cy}" r="14" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
  </g>`;
}
function renderWheel(w) { return `<g transform="translate(${w.x},${w.y})">${renderWheelInner(0,0,w.r,demo.on?demo.wheelAngle:0)}</g>`; }
function renderWheelInner(cx, cy, r, ang) {
  const s = state;
  let inner = '';
  switch (s.wheelStyle) {
    case 'spoke5': inner = spokes(5, r*0.7, s.hubColor, 5); break;
    case 'mesh': inner = spokes(6, r*0.7, s.hubColor, 2) + `<circle r="${r*0.45}" fill="none" stroke="${s.hubColor}" stroke-width="2"/>`; break;
    case 'disk': inner = `<circle r="${r*0.7}" fill="${s.hubColor}"/><circle r="${r*0.5}" fill="none" stroke="#222" stroke-width="1.5"/>`; break;
    case 'star': {
      let pts = '';
      for (let i = 0; i < 10; i++) {
        const a = (i/10) * Math.PI * 2 - Math.PI/2;
        const rr = i%2 === 0 ? r*0.75 : r*0.35;
        pts += `${Math.cos(a)*rr},${Math.sin(a)*rr} `;
      }
      inner = `<polygon points="${pts}" fill="${s.hubColor}"/>`;
      break;
    }
    case 'turbine':
      inner = Array.from({length:6}).map((_,i)=>{
        const a = (i/6) * 360;
        return `<path d="M 0 0 Q ${r*0.4} ${r*0.3} ${r*0.75} 0 L ${r*0.65} ${-r*0.25} Q ${r*0.3} ${-r*0.1} 0 0 Z" fill="${s.hubColor}" transform="rotate(${a})"/>`;
      }).join('');
      break;
    case 'offroad': inner = `<circle r="${r*0.55}" fill="${s.hubColor}"/>` + spokes(6, r*0.5, '#1a1a1a', 4); break;
  }
  const treadDepth = s.wheelStyle === 'offroad' ? 6 : 3;
  let tread = '';
  for (let i = 0; i < 16; i++) {
    const a = (i/16) * 360;
    tread += `<rect x="${r-treadDepth}" y="-2" width="${treadDepth}" height="4" fill="#0f0f0f" transform="rotate(${a})"/>`;
  }
  return `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a1a"/>
    <circle cx="${cx}" cy="${cy}" r="${r*0.85}" fill="#0a0a0a"/>
    <g transform="translate(${cx},${cy}) rotate(${ang})">${tread}${inner}</g>
    <circle cx="${cx}" cy="${cy}" r="${r*0.13}" fill="${s.hubColor}" stroke="#222" stroke-width="1.5"/>`;
}
function spokes(n, r, color, w) {
  return Array.from({length:n}).map((_,i)=>{
    const a = (i/n) * 360;
    return `<line x1="0" y1="0" x2="0" y2="${-r}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" transform="rotate(${a})"/>`;
  }).join('');
}

/* ===== 背景システム（6種類） ===== */
function renderBackground() {
  const bg = state.bgType;
  if (bg === 'road') return renderBgRoad();
  if (bg === 'city') return renderBgCity();
  if (bg === 'race') return renderBgRace();
  if (bg === 'night') return renderBgNight();
  if (bg === 'site') return renderBgSite();
  if (bg === 'beach') return renderBgBeach();
  return renderBgRoad();
}
function skyGradient(top, bottom) {

}
function renderBgRoad() {
