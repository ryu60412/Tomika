<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;

    color: #fff; min-height: 100vh;
  }
  header {
    padding: 12px 20px; background: rgba(0,0,0,.5);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
  }
  header h1 { margin: 0; font-size: 18px; }
  .btns button {
    background: #ff6b35; color: #fff; border: 0;
    padding: 8px 14px; margin-left: 6px; border-radius: 6px;
    cursor: pointer; font-weight: 700;
  }
  .stepper {
    display: flex; gap: 4px; padding: 12px 20px;
    background: rgba(0,0,0,.3); overflow-x: auto;
  }
  .step-pill {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 20px;
    background: rgba(255,255,255,.1); font-size: 12px;
    border: 2px solid transparent; white-space: nowrap;
  }
  .step-pill.active { background: #ff6b35; border-color: #fff; font-weight: 700; }
  .step-pill.done { background: #06d6a0; }
  main {
    display: grid; grid-template-columns: 1fr 380px;
    gap: 16px; padding: 16px;
  }
  @media (max-width: 850px) { main { grid-template-columns: 1fr; } }
  .preview {
    background: linear-gradient(180deg, #87ceeb 0%, #b8e0f0 70%, #6fa050 70%, #4a7530 100%);
    border-radius: 12px; min-height: 380px; position: relative; overflow: hidden;
  }
  .preview svg { width: 100%; height: 100%; display: block; }
  .demo-bar {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 8px;
    display: none; align-items: center; gap: 10px; font-size: 13px;
  }
  .demo-bar.show { display: flex; }
  .demo-bar input[type=range] { flex: 1; }
  .panel {
    background: rgba(0,0,0,.4); border-radius: 12px;
    padding: 16px; max-height: 80vh; overflow-y: auto;
  }
  .panel h2 { margin: 0 0 8px; font-size: 16px; color: #ff6b35; }
  .panel h3 { margin: 14px 0 6px; font-size: 13px; color: #ffd166; }
  .panel p.hint { font-size: 12px; color: #ccc; margin: 0 0 12px; }
  .nav-btns {
    display: flex; justify-content: space-between; margin-top: 16px; gap: 8px;
  }
  .nav-btns button {
    flex: 1; padding: 10px; border: 0; border-radius: 8px;
    cursor: pointer; font-weight: 700; font-size: 14px;
  }
  .btn-back { background: #555; color: #fff; }
  .btn-next { background: #ff6b35; color: #fff; }
  .btn-finish { background: #06d6a0; color: #fff; }
  .card-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  .card {
    background: rgba(255,255,255,.08); border: 2px solid transparent;
    padding: 8px 4px; border-radius: 8px; cursor: pointer;
    text-align: center; transition: .15s;
  }
  .card:hover { background: rgba(255,255,255,.15); }
  .card.selected { border-color: #ff6b35; background: rgba(255,107,53,.2); }
  .card-icon { font-size: 24px; }
  .card-label { font-size: 11px; margin-top: 2px; }
  .color-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
  }
  .color-swatch {
    aspect-ratio: 1; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent;
  }
  .color-swatch.selected { border-color: #fff; transform: scale(1.1); }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; gap: 8px; }
  .row label { font-size: 13px; flex: 1; }
  .row input[type=color] { width: 50px; height: 32px; border: 0; background: none; }
  .row input[type=text], .row select {
    flex: 2; padding: 6px 8px; border-radius: 4px; border: 1px solid #888;
    background: rgba(255,255,255,.9); color: #000;
  }
  .row input[type=range] { flex: 2; }
  .summary {
    background: rgba(255,255,255,.05); padding: 10px; border-radius: 8px;
    font-size: 12px; line-height: 1.6;
  }
  .summary span { color: #ff8855; font-weight: 700; }

/* ====== ステッパー ====== */
function renderStepper() {
  document.getElementById('stepper').innerHTML = STEPS.map((s,i)=>
    `<div class="step-pill ${i===currentStep?'active':''} ${i<currentStep?'done':''}">${s.label}</div>`
  ).join('');
}

/* ====== パネル ====== */
function renderPanel() {
  const step = STEPS[currentStep];
  const panel = document.getElementById('panel');
  let html = '';

  if (step.id === 'body') {
    html = `<h2>働く車を選ぼう！</h2><p class="hint">15種類のラインナップから選択してください。</p>`;
    for (const [cat, list] of Object.entries(CATEGORIES)) {
      html += `<h3>${cat}</h3><div class="card-grid">`;
      list.forEach(k => {
        const c = CARS[k];
        html += `<div class="card ${state.bodyType===k?'selected':''}" onclick="selectBody('${k}')">
          <div class="card-icon">${c.icon}</div>
          <div class="card-label">${c.label}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  else if (step.id === 'color') {
    html = `<h2>カラーリング</h2><p class="hint">メインカラーを選択。サブカラーも変更できます。</p>
      <h3>メインカラー</h3>
      <div class="color-grid">${PALETTE.map(c=>`
        <div class="color-swatch ${state.bodyColor===c?'selected':''}" style="background:${c}" onclick="state.bodyColor='${c}';renderPanel();render()"></div>
      `).join('')}</div>
      <div class="row" style="margin-top:10px"><label>カスタム</label><input type="color" value="${state.bodyColor}" oninput="state.bodyColor=this.value;render()"></div>
      <h3>サブカラー（屋根・ライン）</h3>
      <div class="color-grid">${PALETTE.map(c=>`
        <div class="color-swatch ${state.subColor===c?'selected':''}" style="background:${c}" onclick="state.subColor='${c}';renderPanel();render()"></div>
      `).join('')}</div>
      <div class="row" style="margin-top:10px"><label>カスタム</label><input type="color" value="${state.subColor}" oninput="state.subColor=this.value;render()"></div>`;
  }

  else if (step.id === 'wheel') {
    const styles = [
      ['spoke5','5本スポーク'],['spoke6','6本スポーク'],['truck6','大型トラック'],
      ['mesh','メッシュ'],['turbine','タービン'],['disk','ディスク'],
      ['offroad','オフロード'],['star','スター'],['split5','ツインスポーク']
    ];
    html = `<h2>ホイール</h2><p class="hint">建設車両はオフロード、トラックは大型タイプがおすすめ。</p>
      <div class="row"><label>形状</label>
        <select onchange="state.wheelStyle=this.value;render()">
          ${styles.map(([v,l])=>`<option value="${v}" ${state.wheelStyle===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="row"><label>ホイール色</label><input type="color" value="${state.hubColor}" oninput="state.hubColor=this.value;render()"></div>`;
  }

  else if (step.id === 'extra') {
    html = `<h2>装備</h2><p class="hint">車種に応じた特殊装備があります。</p>
      <div class="row"><label>回転灯（緊急車両）</label><input type="checkbox" ${state.beaconOn?'checked':''} onchange="state.beaconOn=this.checked;render()"></div>
      <p class="hint">※車種ごとの装備（クレーンアーム、ショベル、ドラム等）は自動で表示されます。</p>`;
  }

  else if (step.id === 'decal') {
    html = `<h2>ロゴ・文字</h2><p class="hint">車体に文字を入れられます（例：POLICE、消防、〇〇運輸）</p>
      <div class="row"><label>テキスト</label><input type="text" placeholder="例: POLICE / 消防" value="${escapeHtml(state.decalText)}" oninput="state.decalText=this.value;render()"></div>
      <div class="row"><label>文字色</label><input type="color" value="${state.decalColor}" oninput="state.decalColor=this.value;render()"></div>`;
  }

  else if (step.id === 'finish') {
    const car = CARS[state.bodyType];
    html = `<h2>🎉 完成！</h2>
      <p class="hint">マイトミカが完成しました。走行デモで動きを確認！</p>
      <div class="summary">
        🚗 車種: <span>${car?.label || '-'}</span><br>
        🎨 メイン色: <span>${state.bodyColor}</span><br>
        🎨 サブ色: <span>${state.subColor}</span><br>
        🛞 ホイール: <span>${state.wheelStyle}</span><br>
        📝 ロゴ: <span>${state.decalText||'（なし）'}</span>
      </div>
      <button class="btn-finish" style="width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px" onclick="toggleDemo()">
        ${demo.on?'■ デモを停止':'🏁 走行デモを開始'}
      </button>`;
  }

  const canNext = currentStep === 0 ? state.bodyType !== null : true;
  html += `<div class="nav-btns">
    ${currentStep>0 ? '<button class="btn-back" onclick="prevStep()">← 戻る</button>' : ''}
    ${currentStep<STEPS.length-1 ? `<button class="btn-next" ${canNext?'':'disabled style="opacity:.4;cursor:not-allowed"'} onclick="nextStep()">次へ →</button>` : ''}
  </div>`;

  panel.innerHTML = html;
}

function selectBody(type) {
  state.bodyType = type;
  const car = CARS[type];
  state.bodyColor = car.defaultColor;
  state.subColor = car.defaultSub;
  state.decalText = car.defaultDecal || '';
  // 車種ごとに最適ホイールも設定
  if (['excavator','bulldozer'].includes(type)) state.wheelStyle = 'offroad';
  else if (['tractor'].includes(type)) state.wheelStyle = 'spoke6';
  else if (['cargotruck','dumptruck','tanker','mixer','crane','garbage','firetruck','bus','schoolbus'].includes(type)) state.wheelStyle = 'truck6';
  else state.wheelStyle = 'spoke5';
  renderPanel(); render();
}

function nextStep() { if (currentStep<STEPS.length-1) { currentStep++; renderStepper(); renderPanel(); render(); } }
function prevStep() { if (currentStep>0) { currentStep--; renderStepper(); renderPanel(); render(); } }

/* ====== デモ ====== */
const demo = { on:false, t:0, speed:8, bgOffset:0, wheelAngle:0, raf:null };
function toggleDemo() {
  demo.on = !demo.on;
  document.getElementById('demoBar').classList.toggle('show', demo.on);
  renderPanel();
  if (demo.on) loop(); else { cancelAnimationFrame(demo.raf); render(); }
}
function loop() {
  if (!demo.on) return;
  demo.t++;
  demo.bgOffset = (demo.bgOffset + demo.speed) % 80;
  demo.wheelAngle = (demo.wheelAngle + demo.speed*5) % 360;
  render();
  demo.raf = requestAnimationFrame(loop);
}

/* ====== メイン描画 ====== */
function render() {
  const svg = document.getElementById('stage');
  if (!state.bodyType) {
    svg.innerHTML = `${renderBackground()}<text x="400" y="200" text-anchor="middle" font-size="26" fill="rgba(255,255,255,.7)">← 働く車を選んでください</text>`;
    return;
  }
  const car = CARS[state.bodyType];
  const bounce = demo.on ? Math.sin(demo.t * 0.3) * 2 : 0;

  const grads = `
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lighten(state.bodyColor, 0.25)}"/>
        <stop offset="50%" stop-color="${state.bodyColor}"/>
        <stop offset="100%" stop-color="${darken(state.bodyColor, 0.25)}"/>
      </linearGradient>
      <linearGradient id="subGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lighten(state.subColor, 0.2)}"/>
        <stop offset="100%" stop-color="${state.subColor}"/>
      </linearGradient>
      <radialGradient id="headGlow">
        <stop offset="0%" stop-color="#ffffcc" stop-opacity="1"/>
        <stop offset="60%" stop-color="#ffff88" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#ffff00" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="bodyClip"><path d="${car.body()}"/></clipPath>
    </defs>`;

  const bg = renderBackground();
  const shadow = `<ellipse cx="400" cy="335" rx="290" ry="10" fill="rgba(0,0,0,.35)"/>`;

  // クローラー（建設機械）
  let crawlers = '';
  if (car.crawlers) {
    crawlers = renderCrawler(car.wheelF.x, 312) + renderCrawler(car.wheelR.x, 312);
  }

  // フェンダーアーチ
  let arches = '';
  if (!car.crawlers) {
    [car.archF, car.archR, car.archR2, car.archR3].filter(Boolean).forEach(a => {
      arches += `<circle cx="${a.x}" cy="${a.y}" r="${a.r}" fill="#0a0a0a"/>`;
    });
  }

  // ボディ（太い黒縁取りでおもちゃ感）
  const bodyEl = `<path d="${car.body()}" fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" transform="translate(0,${bounce})"/>`;

  // サブカラー塗装（屋根 or 下半分）
  let subPaint = '';
  if (car.bodyStyle === 'sedan') {
    // パトカー風2トーン
    subPaint = `<rect x="0" y="262" width="800" height="50" fill="url(#subGrad)" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  } else if (['van','truck','bus'].includes(car.bodyStyle)) {
    // 屋根帯
    subPaint = `<rect x="0" y="100" width="800" height="40" fill="url(#subGrad)" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  }

  // サイドストライプ
  let stripe = '';
  if (car.sideStripe === 'middle') {
    stripe = `<rect x="0" y="248" width="800" height="6" fill="${state.subColor}" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  } else if (car.sideStripe === 'cross') {
    // 救急車の赤十字ライン
    stripe = `<rect x="0" y="180" width="800" height="8" fill="${state.subColor}" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
  }

  // ガラス（青みがかった）
  const glass = car.window ? `
    <path d="${car.window()}" fill="rgba(70,130,180,.65)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,${bounce})"/>
    <path d="${car.window()}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1" transform="translate(0,${bounce})"/>` : '';

  // Bピラー
  let pillars = '';
  (car.pillars || []).forEach(px => {
    pillars += `<line x1="${px}" y1="155" x2="${px}" y2="220" stroke="${state.bodyColor}" stroke-width="5" stroke-linecap="round" transform="translate(0,${bounce})"/>`;
  });

  // ライト
  let lights = '';
  const h = car.headlight, t = car.taillight;
  lights += `<circle cx="${h.x}" cy="${h.y+bounce}" r="9" fill="#fff7c2" stroke="#1a1a1a" stroke-width="2"/>`;
  lights += `<circle cx="${h.x}" cy="${h.y+bounce}" r="5" fill="#ffffff"/>`;
  lights += `<circle cx="${t.x}" cy="${t.y+bounce}" r="7" fill="#ff2222" stroke="#1a1a1a" stroke-width="2"/>`;
  lights += `<circle cx="${t.x}" cy="${t.y+bounce}" r="3" fill="#ffaaaa"/>`;
  if (demo.on) {
    lights += `<ellipse cx="${h.x-22}" cy="${h.y+bounce}" rx="35" ry="12" fill="url(#headGlow)" opacity="0.6"/>`;
  }

  // グリル
  let grille = '';
  if (car.grille) {
    const g = car.grille;
    grille = `<rect x="${g.x}" y="${g.y+bounce}" width="${g.w}" height="${g.h}" fill="#1a1a1a" stroke="#333" stroke-width="1" rx="2"/>`;
    for (let i = 0; i < Math.floor(g.h/6); i++) {
      grille += `<line x1="${g.x+2}" y1="${g.y+bounce+5+i*6}" x2="${g.x+g.w-2}" y2="${g.y+bounce+5+i*6}" stroke="#666" stroke-width="1"/>`;
    }
  }

  // ドアハンドル
  let handles = '';
  (car.doorHandles || []).forEach(dh => {
    handles += `<rect x="${dh.x-9}" y="${dh.y+bounce-2}" width="18" height="4" rx="2" fill="#1a1a1a"/>
                <rect x="${dh.x-8}" y="${dh.y+bounce-1.5}" width="16" height="1.5" fill="rgba(255,255,255,.4)"/>`;
  });

  // サイドミラー
  let mirror = '';
  if (car.mirror) {
    mirror = `<path d="M ${car.mirror.x} ${car.mirror.y+bounce} l 14 -3 l 3 10 l -14 3 z" fill="${state.bodyColor}" stroke="#1a1a1a" stroke-width="1.5"/>`;
  }

  // 屋根装備
  let roofItem = '';
  if (car.roofItem === 'siren' && state.beaconOn) {
    roofItem = renderSiren(car, bounce);
  } else if (car.roofItem === 'fireLadder') {
    roofItem = renderFireLadder(car, bounce);
  }

  // 車種別アクセサリー
  let accessories = '';
  if (car.accessories === 'shovelArm') accessories = renderShovelArm(bounce);
  if (car.accessories === 'bulldozerBlade') accessories = renderBulldozerBlade(bounce);
  if (car.accessories === 'craneArm') accessories = renderCraneArm(bounce);
  if (car.accessories === 'dumpBed') accessories = renderDumpBed(bounce);
  if (car.accessories === 'mixerDrum') accessories = renderMixerDrum(bounce);
  if (car.accessories === 'tankerTank') accessories = renderTankerTank(bounce);
  if (car.accessories === 'busStripe') accessories = renderBusStripe(bounce);
  if (car.accessories === 'fireGear') accessories = renderFireGear(bounce);

  // デカール（ロゴ枠付き）
  let decal = '';
  if (state.decalText) {
    const w = state.decalText.length * 14 + 30;
    decal = `<g transform="translate(400,${245+bounce})">
      <rect x="${-w/2}" y="-18" width="${w}" height="32" fill="${state.subColor}" stroke="#1a1a1a" stroke-width="2.5" rx="4"/>
      <text x="0" y="6" font-size="22" font-weight="900" fill="${state.decalColor}" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" letter-spacing="1">${escapeHtml(state.decalText)}</text>
    </g>`;
  }

  // ホイール
  let wheels = '';
  if (!car.crawlers) {
    [car.wheelF, car.wheelR, car.wheelR2, car.wheelR3].filter(Boolean).forEach(w => {
      wheels += renderWheel(w);
    });
  }

  svg.innerHTML = `${grads}${bg}${shadow}${crawlers}${arches}${bodyEl}${subPaint}${stripe}${glass}${pillars}${grille}${lights}${handles}${mirror}${roofItem}${accessories}${decal}${wheels}`;
}

/* ====== 緊急車両：回転灯 ====== */
function renderSiren(car, bounce) {
  const positions = {
    police:{x:415,y:158}, ambulance:{x:455,y:130}
  };
  const p = positions[state.bodyType] || {x:400,y:155};
  const blink = demo.on && Math.floor(demo.t/8)%2===0;
  return `<g transform="translate(${p.x},${p.y+bounce})">
    <rect x="-32" y="-16" width="64" height="14" rx="3" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
    <rect x="-30" y="-14" width="28" height="10" fill="${blink?'#ff3333':'#660000'}" stroke="#fff" stroke-width="0.5"/>
    <rect x="2" y="-14" width="28" height="10" fill="${blink?'#3333ff':'#000066'}" stroke="#fff" stroke-width="0.5"/>
    ${demo.on && blink ? `
      <circle cx="-16" cy="-9" r="22" fill="#ff3333" opacity="0.35"/>
      <circle cx="16" cy="-9" r="22" fill="#3333ff" opacity="0.35"/>` : ''}
  </g>`;
}

/* ====== 消防車：はしご ====== */
function renderFireLadder(car, bounce) {
  return `<g transform="translate(540,140) translate(0,${bounce})">
    <rect x="-160" y="-10" width="320" height="6" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-160" y="0" width="320" height="6" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.5"/>
    ${Array.from({length:16}).map((_,i)=>`<rect x="${-155+i*20}" y="-10" width="3" height="16" fill="#888"/>`).join('')}
    <circle cx="-100" cy="-5" r="6" fill="#ffd60a" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>`;
}

/* ====== ショベルアーム ====== */
function renderShovelArm(bounce) {
  const ang = demo.on ? Math.sin(demo.t*0.05)*10 : 0;
  return `<g transform="translate(360,200) translate(0,${bounce}) rotate(${ang})">
    <rect x="0" y="-12" width="120" height="20" fill="${state.bodyColor}" stroke="#1a1a1a" stroke-width="2.5" rx="3"/>
    <g transform="translate(120,0)">
      <rect x="0" y="-10" width="100" height="16" fill="${state.bodyColor}" stroke="#1a1a1a" stroke-width="2.5" rx="3" transform="rotate(35)"/>
      <g transform="translate(82,57)">
        <path d="M -25 -10 L 25 -10 L 30 25 L -20 25 Z" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
        <path d="M -20 25 L 30 25 L 25 32 L -15 32 Z" fill="#444"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="5" fill="#666" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="120" cy="0" r="5" fill="#666" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>`;
}

/* ====== ブルドーザーブレード ====== */
function renderBulldozerBlade(bounce) {
  return `<g transform="translate(170,260) translate(0,${bounce})">
    <path d="M 0 -50 Q -10 -20 0 20 L 50 25 L 50 -45 Z" fill="${darken(state.bodyColor,0.2)}" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 0 -50 Q -10 -20 0 20 L 50 25 L 50 -45 Z" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <line x1="50" y1="-30" x2="100" y2="-15" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="50" y1="10" x2="100" y2="20" stroke="#1a1a1a" stroke-width="4"/>
  </g>`;
}

/* ====== クレーンアーム ====== */
function renderCraneArm(bounce) {
  return `<g transform="translate(420,240) translate(0,${bounce})">
    <rect x="-20" y="-10" width="40" height="20" fill="${darken(state.bodyColor,0.15)}" stroke="#1a1a1a" stroke-width="2" rx="2"/>
    <g transform="rotate(-40)">
      <rect x="0" y="-8" width="260" height="16" fill="${state.bodyColor}" stroke="#1a1a1a" stroke-width="2.5" rx="2"/>
      ${Array.from({length:8}).map((_,i)=>`<line x1="${20+i*30}" y1="-8" x2="${20+i*30}" y2="8" stroke="#1a1a1a" stroke-width="1.5"/>`).join('')}
      <line x1="260" y1="0" x2="260" y2="70" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="252" y="70" width="16" height="14" fill="#888" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>
  </g>`;
}

/* ====== ダンプベッド ====== */
function renderDumpBed(bounce) {
  return `<g transform="translate(0,${bounce})">
    <path d="M 360 160 L 360 240 L 720 240 L 720 200 L 700 160 Z" fill="${darken(state.bodyColor,0.15)}" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
    ${Array.from({length:6}).map((_,i)=>`<line x1="${380+i*55}" y1="160" x2="${380+i*55}" y2="240" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/>`).join('')}
  </g>`;
}

/* ====== ミキサードラム ====== */
function renderMixerDrum(bounce) {
  const rot = demo.on ? demo.t * 3 : 0;
  return `<g transform="translate(530,200) translate(0,${bounce})">
    <ellipse cx="0" cy="0" rx="170" ry="55" fill="${darken(state.bodyColor,0.1)}" stroke="#1a1a1a" stroke-width="3"/>
    <g transform="rotate(${rot})">
      ${Array.from({length:6}).map((_,i)=>`<line x1="${-160+i*60}" y1="-50" x2="${-140+i*60}" y2="50" stroke="rgba(0,0,0,.5)" stroke-width="2.5"/>`).join('')}
    </g>
    <ellipse cx="-170" cy="0" rx="12" ry="40" fill="#1a1a1a"/>
    <ellipse cx="170" cy="0" rx="15" ry="45" fill="${darken(state.bodyColor,0.2)}" stroke="#1a1a1a" stroke-width="2"/>
  </g>`;
}

/* ====== タンク（タンクローリー） ====== */
function renderTankerTank(bounce) {
  return `<g transform="translate(540,195) translate(0,${bounce})">
    <ellipse cx="0" cy="0" rx="170" ry="48" fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="3"/>
    <ellipse cx="-170" cy="0" rx="10" ry="40" fill="#888" stroke="#1a1a1a" stroke-width="2"/>
    <ellipse cx="170" cy="0" rx="10" ry="40" fill="#888" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-20" y="-50" width="40" height="10" fill="#666" stroke="#1a1a1a" stroke-width="2" rx="2"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="${state.subColor}" stroke-width="8"/>

}

/* ====== バスストライプ ====== */
function renderBusStripe(bounce) {
  return `<rect x="95" y="210" width="610" height="10" fill="${state.subColor}" clip-path="url(#bodyClip)" transform="translate(0,${bounce})"/>`;
}

/* ====== 消防車装備 ====== */
function renderFireGear(bounce) {
  return `<g transform="translate(0,${bounce})">
    <rect x="385" y="170" width="50" height="60" fill="${darken(state.bodyColor,0.2)}" stroke="#1a1a1a" stroke-width="2" rx="2"/>
    <rect x="445" y="170" width="50" height="60" fill="${darken(state.bodyColor,0.2)}" stroke="#1a1a1a" stroke-width="2" rx="2"/>
    <rect x="505" y="170" width="50" height="60" fill="${darken(state.bodyColor,0.2)}" stroke="#1a1a1a" stroke-width="2" rx="2"/>
    <circle cx="660" cy="195" r="22" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="660" cy="195" r="14" fill="#444"/>
    <circle cx="660" cy="195" r="6" fill="#888"/>
  </g>`;
}

/* ====== クローラー（建設車両） ====== */
function renderCrawler(cx, cy) {
  const w = 130, h = 20;
  let treads = '';
  for (let i = 0; i < 16; i++) {
    const x = cx - w/2 + i*(w/16) + (demo.on ? demo.bgOffset%8 : 0);
    treads += `<rect x="${x}" y="${cy-10}" width="4" height="20" fill="#333" stroke="#1a1a1a" stroke-width="0.5"/>`;
  }
  return `<g>
    <rect x="${cx-w/2-5}" y="${cy-14}" width="${w+10}" height="28" rx="14" fill="#1a1a1a"/>
    ${treads}
    <circle cx="${cx-w/2}" cy="${cy}" r="14" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="${cx+w/2}" cy="${cy}" r="14" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
  </g>`;
}

/* ====== ホイール ====== */
function renderWheel(w) {
  const s = state, r = w.r;
  const ang = demo.on ? demo.wheelAngle : 0;
  let inner = '';

  switch (s.wheelStyle) {
    case 'spoke5': inner = spokes(5, r*0.7, s.hubColor, 5); break;
    case 'spoke6': inner = spokes(6, r*0.7, s.hubColor, 4); break;
    case 'truck6':
      // トラック用：6穴ホイール
      inner = `<circle r="${r*0.7}" fill="${s.hubColor}" stroke="#1a1a1a" stroke-width="2"/>` +
              Array.from({length:6}).map((_,i)=>{
                const a = (i/6) * Math.PI * 2;
                return `<circle cx="${Math.cos(a)*r*0.45}" cy="${Math.sin(a)*r*0.45}" r="${r*0.12}" fill="#1a1a1a"/>`;
              }).join('') +
              `<circle r="${r*0.18}" fill="#888" stroke="#1a1a1a" stroke-width="1.5"/>`;
      break;
    case 'mesh': inner = spokes(6, r*0.7, s.hubColor, 2) + `<circle r="${r*0.45}" fill="none" stroke="${s.hubColor}" stroke-width="2"/>`; break;
    case 'disk': inner = `<circle r="${r*0.7}" fill="${s.hubColor}"/><circle r="${r*0.5}" fill="none" stroke="#222" stroke-width="1.5"/>`; break;
    case 'star': {
      let pts = '';
      for (let i = 0; i < 10; i++) {
        const a = (i/10) * Math.PI * 2 - Math.PI/2;
        const rr = i%2 === 0 ? r*0.75 : r*0.35;
        pts += `${Math.cos(a)*rr},${Math.sin(a)*rr} `;
      }
      inner = `<polygon points="${pts}" fill="${s.hubColor}"/>`;
      break;
    }
    case 'turbine':
      inner = Array.from({length:6}).map((_,i)=>{
        const a = (i/6) * 360;
        return `<path d="M 0 0 Q ${r*0.4} ${r*0.3} ${r*0.75} 0 L ${r*0.65} ${-r*0.25} Q ${r*0.3} ${-r*0.1} 0 0 Z" fill="${s.hubColor}" transform="rotate(${a})"/>`;
      }).join('');
      break;
    case 'split5':
      inner = Array.from({length:5}).map((_,i)=>{
        const a = (i/5) * 360;
        return `<g transform="rotate(${a})">
          <line x1="-3" y1="0" x2="${-r*0.25}" y2="${-r*0.75}" stroke="${s.hubColor}" stroke-width="3" stroke-linecap="round"/>
          <line x1="3" y1="0" x2="${r*0.25}" y2="${-r*0.75}" stroke="${s.hubColor}" stroke-width="3" stroke-linecap="round"/>
        </g>`;
      }).join('');
      break;
    case 'offroad':
      inner = `<circle r="${r*0.55}" fill="${s.hubColor}"/>` + spokes(6, r*0.5, '#1a1a1a', 4);
      break;
  }

  // ゴツゴツしたトレッド（オフロード時は深く）
  const treadDepth = s.wheelStyle === 'offroad' ? 6 : 3;
  let tread = '';
  for (let i = 0; i < 16; i++) {
    const a = (i/16) * 360;
    tread += `<rect x="${r-treadDepth}" y="-2" width="${treadDepth}" height="4" fill="#0f0f0f" transform="rotate(${a})"/>`;
  }

  return `<g transform="translate(${w.x},${w.y})">
    <circle r="${r}" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
    <circle r="${r*0.85}" fill="#0a0a0a"/>
    <g transform="rotate(${ang})">
      ${tread}
      ${inner}
    </g>
    <circle r="${r*0.13}" fill="${s.hubColor}" stroke="#222" stroke-width="1.5"/>
  </g>`;
}

function spokes(n, r, color, w) {
  return Array.from({length:n}).map((_,i)=>{
    const a = (i/n) * 360;
    return `<line x1="0" y1="0" x2="0" y2="${-r}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" transform="rotate(${a})"/>`;
  }).join('');
}

/* ====== 背景 ====== */
function renderBackground() {
  if (!demo.on) {
    return `<rect x="0" y="280" width="800" height="120" fill="#555"/>
            <rect x="0" y="278" width="800" height="2" fill="#fff"/>`;
  }
  const dashes = [];
  for (let x = -80; x < 880; x += 80) {
    dashes.push(`<rect x="${x + demo.bgOffset}" y="345" width="40" height="6" fill="#fff"/>`);
  }
  const cloudOffset = (demo.t * 0.5) % 900;
  return `
    <ellipse cx="${100-cloudOffset+800}" cy="60" rx="40" ry="15" fill="rgba(255,255,255,.9)"/>
    <ellipse cx="${400-cloudOffset+800}" cy="40" rx="50" ry="18" fill="rgba(255,255,255,.8)"/>
    <ellipse cx="${100-cloudOffset}" cy="60" rx="40" ry="15" fill="rgba(255,255,255,.9)"/>
    <ellipse cx="${400-cloudOffset}" cy="40" rx="50" ry="18" fill="rgba(255,255,255,.8)"/>
    <rect x="0" y="280" width="800" height="120" fill="#555"/>
    ${dashes.join('')}`;
}

/* ====== 共通 ====== */
function lighten(hex, amt) { return shade(hex, amt); }
function darken(hex, amt) { return shade(hex, -amt); }
function shade(hex, amt) {
  const c = hex.replace('#','');
  const num = parseInt(c, 16);
  let r = (num>>16) + Math.round(255*amt);
  let g = ((num>>8)&0xff) + Math.round(255*amt);
  let b = (num&0xff) + Math.round(255*amt);
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function escapeHtml(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);}

/* ====== I/O ====== */
function exportSVG() {
  const blob = new Blob([document.getElementById('stage').outerHTML], {type:'image/svg+xml'});
  download(blob, 'tomica.svg');
}
function exportPNG() {
  const svg = document.getElementById('stage');
  const data = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1600; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 1600, 800);
    canvas.toBlob(b => download(b, 'tomica.png'));
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
}
function saveJSON() {
  const blob = new Blob([JSON.stringify({state, step:currentStep}, null, 2)], {type:'application/json'});
  download(blob, 'tomica-config.json');
}
function loadJSON(e) {
  const reader = new FileReader();
  reader.onload = ev => {
    const d = JSON.parse(ev.target.result);
    Object.assign(state, d.state);
    currentStep = d.step || 0;
    renderStepper(); renderPanel(); render();
  };
  reader.readAsText(e.target.files[0]);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
}
document.getElementById('demoSpeed').addEventListener('input', e => {
  demo.speed = Number(e.target.value);
  document.getElementById('speedLabel').textContent = demo.speed;
});

/* ====== 起動 ====== */
renderStepper();
renderPanel();
render();
</script>
