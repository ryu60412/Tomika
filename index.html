<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1.0, user-scalable=no">
<title>マイトミカつくろう！</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; background: #ffd966; font-weight: 700; }
.app { width: 100vw; height: 100vh; display: grid; grid-template-rows: 70px 1fr 90px; }
header { background: #ee5253; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
header h1 { margin: 0; font-size: 26px; letter-spacing: 2px; }
.header-btns button { background: #fff; color: #ee5253; border: 0; padding: 10px 16px; border-radius: 30px; font-size: 16px; font-weight: 900; cursor: pointer; margin-left: 6px; box-shadow: 0 3px 0 #c33; }
.header-btns button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c33; }
main { display: grid; grid-template-columns: 1fr 380px; gap: 14px; padding: 14px; overflow: hidden; }
.preview { background: linear-gradient(180deg, #87ceeb 0%, #b8e0f0 60%, #6fa050 60%, #4a7530 100%); border-radius: 20px; position: relative; overflow: hidden; border: 6px solid #fff; }
.preview svg { width: 100%; height: 100%; display: block; }
.demo-bar { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(0,0,0,.7); padding: 10px 16px; border-radius: 30px; display: none; align-items: center; gap: 12px; color: #fff; font-size: 18px; }
.demo-bar.show { display: flex; }
.demo-bar input[type=range] { flex: 1; height: 30px; }
.panel { background: #fff; border-radius: 20px; padding: 16px; overflow-y: auto; border: 4px solid #ffe066; }
.panel h2 { margin: 0 0 12px; font-size: 22px; color: #ee5253; text-align: center; }
.car-tab-bar { display: flex; gap: 6px; margin-bottom: 10px; }
.car-tab { flex: 1; padding: 10px; border: 0; border-radius: 12px; background: #f0f0f0; font-size: 16px; font-weight: 900; cursor: pointer; }
.car-tab.active { background: #4ecdc4; color: #fff; }
.car-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.car-card { background: #fff8e1; border: 3px solid #ffd966; padding: 10px 4px; border-radius: 14px; text-align: center; cursor: pointer; }
.car-card:active { transform: scale(0.95); }
.car-card.selected { background: #ff6b6b; border-color: #c0392b; color: #fff; }
.car-icon { font-size: 32px; }
.car-label { font-size: 13px; margin-top: 4px; }
.color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.color-swatch { aspect-ratio: 1; border-radius: 50%; border: 4px solid #fff; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.color-swatch.selected { border-color: #333; transform: scale(1.15); }
.wheel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wheel-card { background: #f0f0f0; border: 3px solid #ddd; border-radius: 14px; padding: 8px; text-align: center; cursor: pointer; }
.wheel-card.selected { background: #ffd966; border-color: #f39c12; }
.wheel-card svg { width: 50px; height: 50px; }
.wheel-card .lbl { font-size: 12px; margin-top: 2px; }
footer { background: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
.step-dots { display: flex; gap: 8px; }
.step-dot { width: 16px; height: 16px; border-radius: 50%; background: #ddd; }
.step-dot.active { background: #ee5253; transform: scale(1.4); }
.step-dot.done { background: #06d6a0; }
.btn-nav { padding: 14px 26px; border: 0; border-radius: 50px; font-size: 20px; font-weight: 900; cursor: pointer; color: #fff; }
.btn-back { background: #aaa; box-shadow: 0 4px 0 #888; }
.btn-next { background: #4ecdc4; box-shadow: 0 4px 0 #2eaba2; }
.btn-nav:active { transform: translateY(3px); box-shadow: none; }
.btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
.finish-msg { text-align: center; padding: 20px; }
.finish-msg .big { font-size: 60px; margin: 10px 0; }
.finish-msg .ttl { font-size: 28px; color: #ee5253; margin-bottom: 10px; }
.finish-actions button { width: 100%; margin: 6px 0; padding: 14px; border: 0; border-radius: 14px; font-size: 18px; font-weight: 900; cursor: pointer; color: #fff; }
.btn-save { background: #4ecdc4; }
.btn-again { background: #ff6b6b; }
.btn-play { background: #ff6b6b; }
</style>
</head>
<body>

<div class="app">
<header>
<h1>🚗 マイトミカ つくろう！</h1>
<div class="header-btns">
<button onclick="saveJSON()">ほぞん</button>
<button onclick="document.getElementById('loadFile').click()">よみこむ</button>
<input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadJSON(event)">
</div>
</header>

<main>
<div class="preview">
<svg id="stage" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="demo-bar" id="demoBar">
<span>🏁 はやさ</span>
<input type="range" id="demoSpeed" min="1" max="20" value="10">
<span style="font-size:24px">⚡</span>
</div>
</div>
<aside class="panel" id="panel"></aside>
</main>

<footer>
<button class="btn-nav btn-back" id="btnBack" onclick="prevStep()">← もどる</button>
<div class="step-dots" id="stepDots"></div>
<button class="btn-nav btn-next" id="btnNext" onclick="nextStep()">つぎへ →</button>
</footer>
</div>
